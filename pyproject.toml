[project]
name = "file-organizer"
version = "0.1.0"
description = "Organize and analyze files in a local directory."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=13,<15",
    "tqdm>=4.66,<5",
    "typer>=0.12,<1",
]

[project.scripts]
file-organizer = "organizer.cli.organizer:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/organizer"]

[tool.uv]
package = true
